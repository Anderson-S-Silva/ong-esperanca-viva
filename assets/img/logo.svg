<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Ícone: Duas folhas/mãos sobrepostas formando um coração estilizado -->
  <g transform="translate(5, 5)">
    <!-- Folha/Pétala Verde (Esperança) -->
    <path d="M 25 45 C 10 35 5 20 15 10 C 25 0 35 10 25 25 C 25 35 25 45 25 45 Z" fill="#3f6f4f" />
    <!-- Folha/Pétala Terracota (Vida) -->
    <path d="M 25 45 C 40 35 45 20 35 10 C 25 0 15 10 25 25 C 25 35 25 45 25 45 Z" fill="#c8784a" opacity="0.9" />
    <!-- Ponto central de união -->
    <circle cx="25" cy="22" r="3" fill="#fffdf9" />
  </g>

  <!-- Tipografia Institucional -->
  <text x="62" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#3f6f4f" letter-spacing="0.5">
    ESPERANÇA
  </text>
  <text x="62" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#c8784a" letter-spacing="2">
    VIVA
  </text>
  <text x="62" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="7" fill="#6f766f" letter-spacing="1.5">
    ORGANIZAÇÃO SOCIAL
  </text>
</svg>
